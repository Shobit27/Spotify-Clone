                    </svg>
                    <svg class="ico ico-pause" aria-hidden="true">
                        <use href="#i-pause"></use>
                    </svg>
                </button>
                <button class="round-btn" type="button" id="hero-shuffle" aria-label="Shuffle playlist">
                    <svg class="ico" aria-hidden="true">
                        <use href="#i-shuffle"></use>
                    </svg>
                </button>
                <button class="round-btn" type="button" id="hero-download" aria-label="Download playlist">
                    <svg class="ico" aria-hidden="true">
                        <use href="#i-arrow-down-circle"></use>
                    </svg>
                </button>
                <span class="list-sort">List
                    <svg class="ico" aria-hidden="true">
                        <use href="#i-list"></use>
                    </svg>
                </span>
            </div>
            <table class="track-table">
                <thead>
                    <tr>
                        <th class="col-num" scope="col">#</th>
                        <th class="col-title" scope="col">Title</th>
                        <th class="col-album" scope="col">Album</th>
                        <th class="col-duration" scope="col" aria-label="Duration">
                            <svg class="ico" aria-hidden="true">
                                <use href="#i-clock"></use>
                            </svg>
                        </th>
                    </tr>
                </thead>
                <tbody id="track-rows"></tbody>
            </table>
            <p class="empty-note" id="table-empty" hidden>No tracks match your
                search.</p>
        </div>
    </template>

    <script src="./js/data.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
